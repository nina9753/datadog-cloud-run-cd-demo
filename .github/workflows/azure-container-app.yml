name: Azure Container App CD

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/azure-container-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-container-app-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: azure-staging
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      DD_SERVICE: datadog-azure-container-app-cd-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP AZURE_CONTAINER_NAME AZURE_ACR_NAME; do
            test -n "${!name}" || { echo "Missing environment variable: $name"; exit 1; }
          done

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the shared application
        shell: bash
        run: |
          set -euo pipefail
          registry=$(az acr show --name "$AZURE_ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)
          image="$registry/datadog-azure-container-app-cd-demo:$GITHUB_SHA"
          az acr login --name "$AZURE_ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP"
          docker build --platform linux/amd64 \
            --build-arg "DD_GIT_REPOSITORY_URL=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "DD_GIT_COMMIT_SHA=$GITHUB_SHA" \
            --tag "$image" .
          docker push "$image"
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy a new Container App revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-name "$AZURE_CONTAINER_NAME" \
            --image "$DEPLOY_IMAGE" \
            --set-env-vars \
              "DD_SERVICE=$DD_SERVICE" \
              "DD_ENV=staging" \
              "DD_VERSION=$GITHUB_SHA" \
              "DD_GIT_REPOSITORY_URL=https://github.com/$GITHUB_REPOSITORY" \
              "DD_GIT_COMMIT_SHA=$GITHUB_SHA" \
            --output none

      - name: Verify the deployed commit
        shell: bash
        run: |
          set -euo pipefail
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$fqdn"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 15 "https://$fqdn/" | \
              jq -e --arg version "$GITHUB_SHA" --arg service "$DD_SERVICE" \
                '.version == $version and .service == $service' >/dev/null; then
              curl --fail --silent --show-error --max-time 15 "https://$fqdn/health"
              exit 0
            fi
            sleep 10
          done
          echo 'The endpoint did not serve the expected commit and service.'
          exit 1

      - name: Record the verified deployment
        shell: bash
        run: |
          set -euo pipefail
          app=$(az containerapp show --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{id:id,revision:properties.latestReadyRevisionName,latest:properties.latestRevisionName,containers:properties.template.containers[].{name:name,image:image}}' -o json)
          echo "$app" | jq -e --arg container "$AZURE_CONTAINER_NAME" --arg image "$DEPLOY_IMAGE" \
            '.revision != null and .revision == .latest and any(.containers[]; .name == $container and .image == $image)' >/dev/null
          app_id=$(echo "$app" | jq -r '.id')
          revision=$(echo "$app" | jq -r '.revision')
          az tag update --resource-id "$app_id" --operation Merge --tags \
            "deployment_provider=github-actions" \
            "deployment_repository=github.com/$GITHUB_REPOSITORY" \
            "deployment_workflow=.github/workflows/azure-container-app.yml" \
            "deployment_run_id=$GITHUB_RUN_ID" \
            "deployment_revision=$revision" \
            "deployment_commit_sha=$GITHUB_SHA" \
            --output none
