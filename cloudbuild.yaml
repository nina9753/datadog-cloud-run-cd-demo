substitutions:
  _AR_REPOSITORY: cloud-run-source-deploy
  _REPOSITORY_PATH: nina9753-datadog-cloud-run-cd-demo
  _REGION: europe-west1
  _SERVICE_NAME: datadog-cloud-run-cd-demo-git
  _DD_SERVICE: datadog-cloud-run-cd-demo
  _DD_SITE: datad0g.com
  _DATADOG_API_KEY_SECRET: dd-api-key-gcp-staging
  _GCB_TRIGGER_ID: 7ee45bdd-e8e3-45d5-9bf7-9ac0fcc4bca9

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - DD_GIT_REPOSITORY_URL=https://github.com/nina9753/datadog-cloud-run-cd-demo
      - --build-arg
      - DD_GIT_COMMIT_SHA=$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-cpu-throttling
      - --min=0
      - --max=3
      - --update-labels=managed-by=cloud-build,gcb-trigger-id=${_GCB_TRIGGER_ID},source-repository=nina9753-datadog-cloud-run-cd-demo,service=${_DD_SERVICE}
      - --update-secrets=DD_API_KEY=${_DATADOG_API_KEY_SECRET}:latest
      - --update-env-vars=DD_SITE=${_DD_SITE},DD_SERVICE=${_DD_SERVICE},DD_ENV=staging,DD_VERSION=$COMMIT_SHA,DD_GIT_REPOSITORY_URL=https://github.com/nina9753/datadog-cloud-run-cd-demo,DD_GIT_COMMIT_SHA=$COMMIT_SHA,DD_LOGS_ENABLED=true,DD_LOGS_INJECTION=true,DD_LOGS_CONFIG_BATCH_WAIT=1,DD_TRACE_DEBUG=true,DD_LOG_LEVEL=debug,DD_SOURCE=python

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_REPOSITORY_PATH}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
