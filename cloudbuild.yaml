substitutions:
  _AR_REPOSITORY: cloud-run-demo
  _REGION: europe-west1
  _SERVICE_NAME: datadog-cloud-run-cd-demo
  _GCB_TRIGGER_ID: manual-build

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - DD_GIT_REPOSITORY_URL=https://github.com/nina9753/datadog-cloud-run-cd-demo
      - --build-arg
      - DD_GIT_COMMIT_SHA=$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu-throttling
      - --min=0
      - --max=3
      - --labels=gcb-trigger-id=${_GCB_TRIGGER_ID},source-repository=nina9753-datadog-cloud-run-cd-demo
      - --set-env-vars=DD_SERVICE=${_SERVICE_NAME},DD_ENV=staging,DD_VERSION=$COMMIT_SHA,DD_GIT_REPOSITORY_URL=https://github.com/nina9753/datadog-cloud-run-cd-demo,DD_GIT_COMMIT_SHA=$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
